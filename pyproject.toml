[project]
name = "sanocea-commerce-os-phase0"
version = "0.0.1"
description = "Phase 0 foundation for Sanocea Commerce OS"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "python-multipart",
  "pydantic>=2",
  "uvicorn",
  "psycopg2-binary",
  "cryptography",
  "temporalio",
  "boto3",
  "docling",
  "pillow",
  "phonenumbers",
  "google-api-python-client",
  "google-auth-oauthlib",
  "google-cloud-pubsub",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
pythonpath = [".."]
