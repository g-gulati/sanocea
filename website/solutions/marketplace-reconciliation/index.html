              "@type": "Answer",
              "text": "Payout divergence occurs because marketplace settlement batches bundle hundreds of order lines with varying fee schedules, delayed refund debits, courier shipping weight adjustments, and TCS tax deductions. When marketplaces adjust category fee tiers or couriers bill volumetric weight over dead weight, standard bank deposits no longer match gross order expectations."
            }
          },

            "acceptedAnswer": {
              "@type": "Answer",

            }
          },

            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Marketplaces frequently refund customers immediately upon return pickup. If the package is lost in transit by the carrier or delayed past the marketplace return SLA, your balance remains debited. Sanocea tracks the return SLA window; if the item does not register a warehouse receipt scan within the required timeframe, Sanocea flags it for a lost-return reimbursement claim."
            }
          },
