<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANOCEA Operations Command Center — Reference Merchant</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" type="image/png" href="/static/logo.png">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="brand-section">
      <img src="/static/logo.png" alt="SANOCEA Logo" class="brand-logo" onerror="this.style.display='none'">
      <div style="display:flex; align-items:baseline;">
        <span class="brand-title">SANOCEA</span>
        <span class="brand-subtitle">Operations Command Center</span>
      </div>
    </div>

    <div class="tenant-section">
      <div class="tenant-badge">
        <span class="tenant-dot"></span>
        <span>Anchal Heritage Organics (<span class="code-inline">ref_anchal_heritage</span>)</span>
      </div>
      <div class="operator-badge" id="auth-status">
        <span>Authenticating...</span>
      </div>
      <button class="btn btn-outline btn-sm" id="btn-refresh" title="Refresh state from authoritative APIs">
        <span>⟳ Refresh</span>
      </button>
    </div>
  </header>

  <!-- Navigation Tabs (7 Commercial Operations Views) -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="overview">
      <span>Operations Overview</span>
    </button>
    <button class="tab-btn" data-tab="exceptions">
      <span>Exceptions Queue</span>
      <span class="tab-badge tab-badge-danger" id="badge-exceptions" style="display:none;">0</span>
    </button>
    <button class="tab-btn" data-tab="conflicts">
      <span>Evidence & Conflict Review</span>
      <span class="tab-badge tab-badge-danger" id="badge-conflicts" style="display:none;">ACTION</span>
    </button>
    <button class="tab-btn" data-tab="publication">
      <span>Publication & Verification</span>
    </button>
    <button class="tab-btn" data-tab="inventory">
      <span>Orders & Inventory</span>
    </button>
    <button class="tab-btn" data-tab="refunds">
      <span>Returns & Refunds</span>
    </button>
    <button class="tab-btn" data-tab="audit">
      <span>Audit Timeline</span>
    </button>
  </nav>

  <!-- Main View Area -->
  <main class="main-container">
    <section class="tab-content active" id="tab-overview"></section>
    <section class="tab-content" id="tab-exceptions"></section>
    <section class="tab-content" id="tab-conflicts"></section>
    <section class="tab-content" id="tab-publication"></section>
    <section class="tab-content" id="tab-inventory"></section>
    <section class="tab-content" id="tab-refunds"></section>
    <section class="tab-content" id="tab-audit"></section>
  </main>

  <!-- Operator Auth Modal (Safe Local-Dev Mechanism) -->
  <div class="modal-overlay" id="auth-modal" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Operator Authentication</h3>
      </div>
      <p style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">
        To connect to the SANOCEA Operations Command Center, provide the scoped operator API key for <code>ref_anchal_heritage</code>.
      </p>
      <div id="auth-modal-error" style="display:none; color:var(--danger); font-size:12px; margin-bottom:10px;"></div>
      <div style="margin-bottom:16px;">
        <input type="password" id="input-api-key" placeholder="Enter Operator API Key" style="width:100%; box-sizing:border-box; padding:8px 10px; font-size:13px; font-family:monospace; border:1px solid var(--border-color); border-radius:var(--radius-sm);" />
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn btn-outline btn-sm" id="btn-cancel-auth" onclick="closeAuthModal()">Dismiss</button>
        <button class="btn btn-primary btn-sm" id="btn-save-auth" onclick="submitApiKey()">Connect Session</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
